version: 1
project:
  name: tech-playground
provider:
  type: local-git
# Start with local Git. Set the actual GitHub owner/repository when PR mode is needed.
lifecycle:
  review: true
  testPlanning: true
  testExecution: true
  releaseAssurance: true
agents:
  review:
    executor: mock
  testPlanning:
    executor: mock
policies:
  release:
    requireAllRequiredTests: true
    requireHumanApproval: false
testing:
  discovery:
    mode: automatic
  allowedCommands: [pnpm, node, python]
  # Matched to the local Tech Playground scripts/tests on 2026-09-21.
  # No servers, Docker or AI credentials are required for this baseline.
  # Root build/typecheck currently cover every JS/TS workspace.
  commands:
    - id: root-build
      type: custom
      command: pnpm build
      description: Root build
      required: true
      always: true
    - id: root-typecheck
      type: custom
      command: pnpm typecheck
      description: Root typecheck
      required: true
      always: true
    - id: root-metadata
      type: custom
      command: pnpm metadata:validate
      description: Validate all Demo metadata contracts
      required: true
      always: true
    - id: metadata-search
      type: unit
      command: node --import tsx --test --test-name-pattern=metadata tests/playground.test.ts
      description: Demo schema and Portal search regression
      required: true
      files: ["demos/*/demo.yaml", "demos/*/README.md", "apps/portal/**", "packages/playground-ui/**", "packages/demo-schema/**", "tools/metadata.ts", "tests/playground.test.ts", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig*.json"]
    - id: demo-scaffolding
      type: unit
      command: node --import tsx --test --test-name-pattern=CLI tests/playground.test.ts
      description: Template generation, overwrite refusal and path traversal rejection
      required: true
      files: ["tools/create-demo/**", "templates/**", "packages/playground-ui/**", "packages/demo-schema/**", "tests/playground.test.ts", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig*.json"]
    - id: mcp-apps-handles
      type: unit
      command: node --import tsx --test --test-name-pattern=experiment tests/playground.test.ts
      description: MCP experiment handle isolation, invalidation and invalid input
      required: true
      files: ["demos/mcp-apps-playground/**", "packages/playground-ui/**", "tests/playground.test.ts", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig*.json"]
    - id: openfga-authorization
      type: regression
      command: node --import tsx --test --test-name-pattern=sharing tests/playground.test.ts
      description: Local evaluator inheritance, direct grants, revocation and denied access
      required: true
      files: ["demos/openfga-sharing-playground/**", "packages/playground-ui/**", "tests/playground.test.ts", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig*.json"]
    - id: magentic-scrum-runner
      type: integration
      command: python -m unittest -v test_runner
      cwd: demos/maf-magentic-scrum
      description: Mock workflow, real fixture tests, failure/replan and approval boundaries
      required: true
      files: ["demos/maf-magentic-scrum/**", "packages/playground-ui/**"]
    - id: ui-behavior
      type: regression
      command: node --import tsx --test tests/ui-behavior.test.ts
      description: Authorization graph, agent trajectory and MCP form behavior
      required: true
      files: ["packages/playground-ui/**", "apps/portal/**", "demos/*/src/**", "demos/*/domain.ts", "demos/*/contract.ts", "demos/*/experiments.ts", "tests/ui-behavior.test.ts", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig*.json"]
